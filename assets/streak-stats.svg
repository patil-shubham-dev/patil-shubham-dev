<svg width="500" height="195" viewBox="0 0 500 195" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="500" height="195" rx="12" fill="#0d1117" stroke="#1e2d40" stroke-width="1"/>
  <rect width="500" height="195" rx="12" fill="url(#bg-grad)"/>
  
  <!-- Dividers -->
  <line x1="166" y1="20" x2="166" y2="175" stroke="#1e2d40" stroke-width="1"/>
  <line x1="333" y1="20" x2="333" y2="175" stroke="#1e2d40" stroke-width="1"/>
  
  <!-- TOTAL CONTRIBUTIONS -->
  <text x="83" y="55" fill="#94a3b8" font-size="10" font-family="JetBrains Mono,monospace" text-anchor="middle">Total Contributions</text>
  <text x="83" y="100" fill="#e2e8f0" font-size="38" font-weight="800" font-family="JetBrains Mono,monospace" text-anchor="middle">202</text>
  <text x="83" y="128" fill="#475569" font-size="9" font-family="JetBrains Mono,monospace" text-anchor="middle">Apr 2, 2025 – Present</text>
  
  <!-- CURRENT STREAK -->
  <text x="249" y="45" fill="#c084fc" font-size="10" font-weight="600" font-family="JetBrains Mono,monospace" text-anchor="middle">Current Streak</text>
  <!-- Ring -->
  <circle cx="249" cy="100" r="38" fill="none" stroke="#1e2d40" stroke-width="3"/>
  <circle cx="249" cy="100" r="38" fill="none" stroke="url(#ring-grad)" stroke-width="3"
          stroke-dasharray="188" stroke-dashoffset="0" stroke-linecap="round"
          transform="rotate(-90 249 100)"/>
  <text x="249" y="93" fill="#e2e8f0" font-size="28" font-weight="800" font-family="JetBrains Mono,monospace" text-anchor="middle">4</text>
  <text x="249" y="108" fill="#7c3aed" font-size="8" font-family="JetBrains Mono,monospace" text-anchor="middle">days</text>
  <text x="249" y="152" fill="#475569" font-size="9" font-family="JetBrains Mono,monospace" text-anchor="middle">Mar 26 – Mar 29</text>
  <!-- Fire icon -->
  <text x="249" y="30" font-size="12" text-anchor="middle">🔥</text>
  
  <!-- LONGEST STREAK -->
  <text x="416" y="55" fill="#94a3b8" font-size="10" font-family="JetBrains Mono,monospace" text-anchor="middle">Longest Streak</text>
  <text x="416" y="100" fill="#e2e8f0" font-size="38" font-weight="800" font-family="JetBrains Mono,monospace" text-anchor="middle">7</text>
  <text x="416" y="120" fill="#475569" font-size="8" font-family="JetBrains Mono,monospace" text-anchor="middle">days</text>
  <text x="416" y="140" fill="#475569" font-size="9" font-family="JetBrains Mono,monospace" text-anchor="middle">May 14 – May 20</text>
  <text x="416" y="155" fill="#475569" font-size="9" font-family="JetBrains Mono,monospace" text-anchor="middle">2025</text>
</svg>